  <rect x="40" y="24" width="6" height="30" fill="#94a3b8" rx="1"/>
  <line x1="16" y1="54" x2="26" y2="54" stroke="#475569" stroke-width="3"/>
  <line x1="38" y1="54" x2="48" y2="54" stroke="#475569" stroke-width="3"/>
  <!-- Tablero del viaducto -->
